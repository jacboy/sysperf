# Deploys the website (site/) and the script (/bench) to the test instance on
# https://sysperf.jf-l.de, a Cloudron Surfer app.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SURFER_USERNAME      Cloudron username of the account that owns the app password
#   SURFER_APP_PASSWORD  Cloudron app password (Cloudron dashboard -> Profile -> App passwords)

name: Deploy test site

on:
  push:
    branches: [master]
    paths:
      - bench
      - site/**
      - .github/workflows/deploy-test.yml
  workflow_dispatch:

# Read-only access to the repository is all this workflow needs.
permissions:
  contents: read

# Never run two deployments at the same time; a newer one waits for the running one.
concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  SURFER_SERVER: https://sysperf.jf-l.de
  SURFER_CLI_VERSION: 7.2.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: test
      url: https://sysperf.jf-l.de
    steps:
      # Actions are pinned to full commit hashes, not tags, so a moved tag can't change what runs here.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build site
        env:
          SITE_URL: ${{ env.SURFER_SERVER }}
        run: |
          bash site/build.sh
          # _headers is a Cloudflare Pages config file; Surfer would just serve it as a file.
          rm -f dist/_headers

      - name: Install Surfer CLI
        run: npm install --global --no-audit --no-fund "@cloudron/surfer@${SURFER_CLI_VERSION}"

      - name: Deploy to Surfer
        env:
          SURFER_USERNAME: ${{ secrets.SURFER_USERNAME }}
          SURFER_APP_PASSWORD: ${{ secrets.SURFER_APP_PASSWORD }}
        run: |
          if [ -z "$SURFER_USERNAME" ] || [ -z "$SURFER_APP_PASSWORD" ]; then
            echo "::error::Missing secrets SURFER_USERNAME and/or SURFER_APP_PASSWORD"
            exit 1
          fi
          surfer deploy ./dist \
            --server "$SURFER_SERVER" \
            --username "$SURFER_USERNAME" \
            --password "$SURFER_APP_PASSWORD" \
            --message "Build from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}, run ${GITHUB_RUN_ID})"

      - name: Verify deployment
        run: |
          # The live /bench must be byte-identical to the one just built, and the page must
          # show the same version.
          expected=$(cut -d' ' -f1 dist/bench.sha256)
          version=$(sed -n 's/^SYSPERF_VERSION="\([^"]*\)"$/\1/p' bench)
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS --proto '=https' "${SURFER_SERVER}/bench" | sha256sum | cut -d' ' -f1) || live=""
            if [ "$live" = "$expected" ]; then break; fi
            echo "Attempt ${attempt}: live /bench checksum is '${live}', expected ${expected}; retrying"
            sleep 5
          done
          if [ "$live" != "$expected" ]; then
            echo "::error::${SURFER_SERVER}/bench does not match the build"
            exit 1
          fi
          curl -fsS --proto '=https' "${SURFER_SERVER}/" | grep -q "Version ${version}" \
            || { echo "::error::${SURFER_SERVER}/ does not show version ${version}"; exit 1; }
          curl -fsS --proto '=https' "${SURFER_SERVER}/bench" | bash -n
          echo "Deployed sysperf ${version} to ${SURFER_SERVER} (bench sha256 ${expected})"
